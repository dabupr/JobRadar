# Fork this repository, copy profile.example.yaml to profile.yaml, add the secrets below
# and you get job alerts every day for free.
name: Job alerts
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alerts
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: profile
        run: |
          if [ -f profile.yaml ]; then echo "found=true" >> "$GITHUB_OUTPUT"
          else echo "No profile.yaml in this repository: skipping alerts."; fi
      - if: steps.profile.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.profile.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: jobradar.sqlite
          key: jobradar-db-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('profile.yaml') }}
          restore-keys: |
            jobradar-db-${{ runner.os }}-${{ github.ref_name }}-
            jobradar-db-${{ runner.os }}-
      - if: steps.profile.outputs.found == 'true'
        run: pip install -e .
      - if: steps.profile.outputs.found == 'true'
        run: jobradar update --profile profile.yaml --notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

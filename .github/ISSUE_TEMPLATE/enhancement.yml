name: Enhancement
description: Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What areas are impacted (CLI, connectors, workflows, docs)?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we can verify this is done

[project]
name = "jobradar"
version = "0.1.0"
description = "Job alerts and a job board built straight from company career pages (public ATS APIs)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://dabupr.github.io/JobRadar/"
Repository = "https://github.com/dabupr/JobRadar"
Issues = "https://github.com/dabupr/JobRadar/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jobradar = "jobradar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

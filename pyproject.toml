[project]
name = "jobradar"
version = "0.1.0"
description = "Job alerts and a job board built straight from company career pages (public ATS APIs)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://dabupr.github.io/JobRadar/"
Repository = "https://github.com/dabupr/JobRadar"
Issues = "https://github.com/dabupr/JobRadar/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    "build>=1.2",
]

[project.scripts]
jobradar = "jobradar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobradar"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jobradar --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["jobradar"]

[tool.coverage.report]
fail_under = 85
skip_empty = true

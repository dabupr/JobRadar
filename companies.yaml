# Companies to watch. Add one with a pull request.
#   ats:  greenhouse | lever | ashby | workable | recruitee | personio | smartrecruiters
#         | teamtailor | bamboohr | breezy
#   slug: the id in the company's public job board URL
#         greenhouse: boards.greenhouse.io/<slug>    lever: jobs.lever.co/<slug>
#         ashby: jobs.ashbyhq.com/<slug>             workable: apply.workable.com/<slug>
